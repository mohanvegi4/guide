# Local Postgres for development and the backend integration tests.
# Port 5433 on the host to avoid clashing with any Postgres already on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      # Bootstrap superuser — used ONLY by docker/init.sql to create the
      # non-superuser app role. The app itself never connects as this user,
      # because superusers bypass Row-Level Security unconditionally.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - guide_engine_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d guide_engine_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Keycloak for Studio SSO in development (the same provider staging and
  # production use). Opt-in: `npm run idp:up`. Imports docker/keycloak/
  # guide-engine-realm.json on first start: realm "guide-engine", public
  # client "guide-studio" (PKCE) and three test users (olivia / eddie / root,
  # password = username). Admin console: http://localhost:8081 (admin / admin).
  #   OIDC_ISSUER=http://localhost:8081/realms/guide-engine
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["sso"]
    command: ["start-dev", "--import-realm"]
    ports:
      - "8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      # The whole data dir (not a subfolder): a named volume on a path the image
      # already owns stays writable by the keycloak user. Users keep their ids
      # across restarts, which is what ties them to Studio memberships.
      - guide_engine_keycloak:/opt/keycloak/data
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; talk HTTP to the management port over /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

volumes:
  guide_engine_pg:
  guide_engine_keycloak:
