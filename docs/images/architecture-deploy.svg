<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Caddy routes three hostnames to the Studio, backend and Keycloak, which use Postgres">
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#15212c}
.m{fill:#566573}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.a{fill:#0d6a86}.g{fill:#9a6a06}
.box{fill:#fff;stroke:#cfd8e0;stroke-width:1.5}.sunk{fill:#eef2f5;stroke:#cfd8e0;stroke-width:1.5}
.acc{fill:#dcecf2;stroke:#0d6a86;stroke-width:1.5}.gd{fill:#fbefd2;stroke:#c98a0b;stroke-width:1.5}
.ar{stroke:#566573;stroke-width:1.6;fill:none}.ara{stroke:#0d6a86;stroke-width:1.8;fill:none}.dash{stroke-dasharray:5 5}
.h{fill:#566573}.ha{fill:#0d6a86}
</style>
<defs>
<marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="h"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ha"/></marker>
</defs>
<rect width="880" height="250" fill="#f7f9fb"/>
<rect x="20" y="90" width="150" height="70" rx="10" class="sunk"/>
<text x="38" y="120" font-weight="600" font-size="15">Caddy</text>
<text x="38" y="142" class="m" font-size="12.5">TLS, ports 80/443</text>
<rect x="250" y="20" width="250" height="56" rx="9" class="box"/>
<text x="266" y="44" font-weight="600" font-size="14">studio</text><text x="330" y="44" class="mono m" font-size="11.5">STUDIO_HOST</text>
<text x="266" y="64" class="m" font-size="12">nginx + SPA, /api → backend</text>
<rect x="250" y="97" width="250" height="56" rx="9" class="acc"/>
<text x="266" y="121" font-weight="600" font-size="14">backend</text><text x="338" y="121" class="mono m" font-size="11.5">API_HOST</text>
<text x="266" y="141" class="m" font-size="12">API + agent, migrates on start</text>
<rect x="250" y="174" width="250" height="56" rx="9" class="box"/>
<text x="266" y="198" font-weight="600" font-size="14">keycloak</text><text x="342" y="198" class="mono m" font-size="11.5">AUTH_HOST</text>
<text x="266" y="218" class="m" font-size="12">author sign-in</text>
<rect x="590" y="97" width="270" height="86" rx="10" class="sunk"/>
<text x="606" y="123" font-weight="600" font-size="14">PostgreSQL 16</text>
<text x="606" y="145" class="m" font-size="12">guide_engine + keycloak databases</text>
<text x="606" y="165" class="m" font-size="12">nightly dumps by the backup service</text>
<path d="M170 112 L248 52" class="ar" marker-end="url(#m)"/>
<path d="M170 125 L248 125" class="ar" marker-end="url(#m)"/>
<path d="M170 138 L248 200" class="ar" marker-end="url(#m)"/>
<path d="M500 48 C540 48 540 112 498 118" class="ar dash" marker-end="url(#m)"/>
<path d="M500 128 L588 135" class="ar" marker-end="url(#m)"/>
<path d="M500 200 L588 165" class="ar" marker-end="url(#m)"/>
</svg>
