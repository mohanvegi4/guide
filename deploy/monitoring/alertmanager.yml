# Alertmanager for the deploy/ stack (`docker compose --profile monitoring up -d`).
# Prometheus (prometheus.yml, `alerting:`) sends it every alert from alerts.yml;
# this file says where they go. Deliberately minimal: one route, one receiver.
#
# The webhook URL is NOT in this file. Alertmanager expands no environment
# variables, so the compose stack mounts ALERT_WEBHOOK_URL from .env as the
# secret file named below (`url_file`), the same way Prometheus gets its
# METRICS_TOKEN. Outside compose, write the URL to a file and point `url_file`
# at it, or replace it with `url:`.
#
# Check:  amtool check-config alertmanager.yml

route:
  receiver: webhook
  # One notification per alert name (all backend replicas together), sent 30 s
  # after the first alert of a group arrives, with changes to the group batched
  # 5 min apart. Still-firing alerts are re-sent every 4 h.
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # Every rule in alerts.yml carries `severity: page` (users affected now) or
  # `severity: warn` (look today). To send them to different places, add a
  # receiver and a sub-route; alerts that match no sub-route use the receiver
  # above.
  # routes:
  #   - matchers: ['severity="page"']
  #     receiver: pager
  #     repeat_interval: 1h

receivers:
  - name: webhook
    webhook_configs:
      # Alertmanager's standard JSON payload (receiver, status, alerts[] with
      # labels and annotations). Slack, Teams, PagerDuty, Opsgenie and most
      # on-call tools accept it on an "Alertmanager"/"Prometheus" integration
      # URL; Alertmanager also has native *_configs for each of them.
      - url_file: /run/secrets/alert_webhook_url
        send_resolved: true

  # Email instead of, or as well as, the webhook. Keep the SMTP password out of
  # this file like the webhook URL: a compose secret and `smtp_auth_password_file`.
  # - name: email
  #   email_configs:
  #     - to: ops@example.com
  #       from: alertmanager@example.com
  #       smarthost: smtp.example.com:587
  #       auth_username: alertmanager@example.com
  #       auth_password_file: /run/secrets/alert_smtp_password
  #       send_resolved: true
